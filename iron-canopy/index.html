<meta charset="utf-8">
<title>Iron Canopy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">

<div class="app" id="app">
  <canvas id="map" aria-label="Tactical map. Drag to pan, scroll to zoom, click to select, right-click to give orders."></canvas>

  <header class="topbar" id="topbar">
    <div class="tb-left">
      <div class="brand"><b>Iron</b> Canopy</div>
      <div class="clock"><strong id="hClock">Day 1 · 06:00</strong><span id="hSky">Dawn</span></div>
      <div class="speed" id="speed" role="group" aria-label="Game speed"></div>
    </div>
    <div class="tb-center" id="alerts" aria-live="polite"></div>
    <div class="tb-right">
      <div class="tbrow"><div class="stats" id="stats"></div><div class="sysbtns" id="sys"></div></div>
      <div class="rules" id="rules"></div>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="War rooms"></nav>

  <div class="leftcol">
    <section class="brief" id="brief" aria-label="Situation"></section>
    <section class="comms" id="comms" aria-label="Staff messages"></section>
    <section class="airpic" id="airpic" aria-label="Air picture"></section>
  </div>
  <div class="feed" id="feed" aria-live="polite"></div>

  <aside class="insp" id="insp" aria-label="Selection"></aside>

  <div class="arsenal" id="arsenal" aria-label="Arsenal"></div>

  <div class="mapbox" id="mapbox">
    <div class="layers" id="layers"></div>
    <div class="mapctl">
      <button data-act="zin" aria-label="Zoom in" title="Zoom in (+)">+</button><button data-act="zout" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button class="w" data-act="zhome" title="Capital (Home)">Capital</button><button class="w" data-act="zfull" title="Whole region">Region</button>
    </div>
    <canvas id="mini" aria-label="Minimap. Click to move the view."></canvas>
  </div>

  <div class="warroom" id="warroom" hidden>
    <div class="wr-head">
      <nav class="wr-tabs" id="wrTabs"></nav>
      <span class="wr-run" id="wrRun"></span>
      <button class="x" data-act="wrclose" aria-label="Close" title="Close (Esc)">✕</button>
    </div>
    <div class="wr-body" id="wrBody"></div>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="modehint" id="modehint" hidden></div>
  <div class="cine" id="cine" hidden></div>
  <div class="incidents" id="incidents" aria-live="assertive"></div>
  <div class="evcard" id="evcard" hidden role="dialog" aria-label="Decision"></div>

  <div class="modal start" id="start">
    <div class="st-wrap">
      <div class="st-main">
        <p class="kicker">Airports · airspace · air defence</p>
        <h1 class="title">Iron <b>Canopy</b></h1>
        <p class="tagline">Build the airports. Run the skies. Then defend them.</p>

        <div class="st-page" id="st-main">
          <div class="modes">
            <button class="mode hero" data-act="begin" data-v="story"><em>Start here</em><b>Career</b><span>Begin as Director of Civil Aviation: run the airports and the airlines while the neighbour tests the border. Four acts, from the control tower to Chief of the Air Force.</span><kbd>Enter</kbd></button>
            <button class="mode" data-act="begin" data-v="campaign"><b>Quick war</b><span>Hours of tension, then open war. Raids build up and strike in waves. Hold for three days with the country working.</span></button>
            <button class="mode" data-act="stPage" data-v="lessons"><b>Academy</b><span>Short lessons, one system at a time: radars, identification, layers, missiles in space, jamming, supply.</span><small id="acaProg"></small></button>
            <button class="mode" data-act="begin" data-v="range"><b>Test range</b><span>An empty plane. Place any system, send any threat from any side, and read the results.</span></button>
          </div>
          <div class="st-foot">
            <button class="btn" data-act="stPage" data-v="settings">Settings</button>
            <button class="btn" data-act="stPage" data-v="keys">Controls</button>
            <button class="btn ghost" data-act="begin" data-v="sandbox" title="Partly mobilized, fully deployed, war at dawn. No staff guidance.">Sandbox: war at dawn, no guidance</button>
          </div>
        </div>

        <div class="st-page" id="st-lessons" hidden>
          <div class="st-head"><button class="btn" data-act="stPage" data-v="main">◂ Back <kbd>Esc</kbd></button><h2>Academy</h2></div>
          <div class="lessons" id="lessons"></div>
        </div>
        <div class="st-page" id="st-settings" hidden>
          <div class="st-head"><button class="btn" data-act="stPage" data-v="main">◂ Back <kbd>Esc</kbd></button><h2>Settings</h2></div>
          <div class="st-cards" id="stSettings"></div>
        </div>
        <div class="st-page" id="st-keys" hidden>
          <div class="st-head"><button class="btn" data-act="stPage" data-v="main">◂ Back <kbd>Esc</kbd></button><h2>Controls</h2></div>
          <div class="st-cards" id="stKeys"></div>
        </div>
      </div>

      <aside class="st-region">
        <small>The region</small>
        <p class="lead" id="startLead">Generating the region…</p>
        <div class="seedrow"><span>Map <b id="seed">—</b></span><button class="btn sm" data-act="reroll" title="Generate another region">New map</button></div>
      </aside>
    </div>
  </div>

  <div class="menu" id="menu" hidden role="dialog" aria-label="Menu">
    <div class="mbox2 glass">
      <small id="menuTime"></small>
      <h2>Paused</h2>
      <button class="mi" data-act="menu"><b>Resume</b><kbd>Esc</kbd></button>
      <button class="mi" data-act="room" data-v="reference"><b>Guide</b><span>How every system works</span><kbd>?</kbd></button>
      <button class="mi" data-act="room" data-v="settings"><b>Settings</b><span>Display, sound, auto-pause, hints</span></button>
      <button class="mi warn" data-act="restart"><b>Quit to the main menu</b><span>This game is not kept</span></button>
    </div>
  </div>
  <div class="unlock" id="unlock" hidden aria-live="polite"></div>
  <div class="hints" id="hints"></div>

  <div class="modal" id="over" hidden>
    <div class="mbox glass">
      <p class="kicker" id="overKicker">Result</p>
      <h2 id="overTitle">The defense has failed</h2>
      <p id="overText"></p>
      <div class="stars" id="overStars"></div>
      <div class="ostats" id="overStats"></div>
      <div class="orow"><button class="btn primary" data-act="restart">Main menu</button><button class="btn" id="overNext" data-act="nextLesson" hidden>Next lesson</button><button class="btn" id="overRetry" data-act="retryLesson" hidden>Try again</button><button class="btn" data-act="keepPlaying" id="overKeep">Keep watching</button></div>
    </div>
  </div>
</div>
