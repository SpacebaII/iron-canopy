name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # three parts of equal length (by tests/times.json) on three machines at once, each with one worker per core
    # (two halves outgrew the 20 minutes once a day at each real airport joined the suite)
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js --shard=${{ matrix.shard }}
