name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # eight parts of equal length (by tests/times.json) on eight machines at once, each with one worker per core
    # (two halves outgrew the 20 minutes once a day at each real airport joined the suite; four parts once the
    # cities' streets were traced on a direction field, brief 53; eight once every housing block had streets of its
    # own, brief 68, a part of six ran past 30 minutes, and the map's Career joined the suite, brief 71)
    strategy:
      fail-fast: false
      matrix:
        shard: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js --shard=${{ matrix.shard }}
