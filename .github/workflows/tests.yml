name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # twelve parts of equal length (by tests/times.json) on twelve machines at once, each with one worker per core
    # (two halves outgrew the 20 minutes once a day at each real airport joined the suite; four parts once the
    # cities' streets were traced on a direction field, brief 53; eight once every housing block had streets of its
    # own, brief 68, a part of six ran past 30 minutes, and the map's Career joined the suite, brief 71; twelve once
    # parts of eight ran past 30 minutes on main as well, the day at KLAX alone taking 20 of them)
    strategy:
      fail-fast: false
      matrix:
        shard: [1/12, 2/12, 3/12, 4/12, 5/12, 6/12, 7/12, 8/12, 9/12, 10/12, 11/12, 12/12]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js --shard=${{ matrix.shard }}
