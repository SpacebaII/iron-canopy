name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # six parts of equal length (by tests/times.json) on six machines at once, each with one worker per core
    # (two halves outgrew the 20 minutes once a day at each real airport joined the suite; four parts once the
    # cities' streets were traced on a direction field, brief 53)
    strategy:
      fail-fast: false
      matrix:
        shard: [1/6, 2/6, 3/6, 4/6, 5/6, 6/6]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js --shard=${{ matrix.shard }}
