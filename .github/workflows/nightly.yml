name: nightly

# the long balance runs (a scripted Career through Act I, a Quick war commander over two days), every night on main
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js --slow
